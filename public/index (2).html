<style>
  :root {
    --bg: #111111;
    --ink: #FFFFFF;
    --muted: #A8A8A8;
    --grey: #D0D0D0;
    --blue: #003399;
    --yellow: #FFCC00;
    --line: #2C2C2C;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); color-scheme: dark; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font: 18px/1.6 var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .wrap { width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 28px; }

  a:focus-visible { outline: 3px solid var(--yellow); outline-offset: 4px; }

  header { padding: 30px 0; }
  .logo { display: block; height: 40px; width: auto; }

  main { flex: 1; }

  .hero {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 64px;
    align-items: center;
    padding: 40px 0 80px;
  }

  h1 {
    font: 600 clamp(3rem, 8vw, 6rem)/1 var(--serif);
    letter-spacing: -0.015em;
    margin: 0 0 30px;
  }
  .lede { font-size: 1.35rem; color: var(--grey); margin: 0 0 10px; }
  .soon { font: italic 400 1.7rem/1.2 var(--serif); color: var(--yellow); margin: 0; }

  .gate { width: 100%; max-width: 380px; height: auto; justify-self: end; display: block; }

  .leaf {
    animation-duration: 1.8s;
    animation-delay: 0.6s;
    animation-fill-mode: forwards;
    animation-timing-function: cubic-bezier(.65, 0, .35, 1);
  }
  .leaf-l { animation-name: open-left; }
  .leaf-r { animation-name: open-right; }
  @keyframes open-left  { to { transform: translateX(-112px); } }
  @keyframes open-right { to { transform: translateX(112px); } }

  .bar {
    transform-box: fill-box;
    transform-origin: left center;
    transform: scaleX(0);
    animation: grow 0.7s ease-out forwards;
  }
  .bar:nth-child(1) { animation-delay: 2.3s; }
  .bar:nth-child(2) { animation-delay: 2.55s; }
  .bar:nth-child(3) { animation-delay: 2.8s; }
  .bar:nth-child(4) { animation-delay: 3.05s; }
  .bar:nth-child(5) { animation-delay: 3.3s; }
  @keyframes grow { to { transform: scaleX(1); } }

  @media (prefers-reduced-motion: reduce) {
    .leaf { animation: none; }
    .leaf-l { transform: translateX(-112px); }
    .leaf-r { transform: translateX(112px); }
    .bar { animation: none; transform: none; }
  }

  .contact { border-top: 1px solid var(--line); padding: 56px 0 72px; }
  .contact p { font: 400 clamp(1.5rem, 3.4vw, 2rem)/1.3 var(--serif); margin: 0 0 14px; max-width: 18em; }
  .mail {
    font: 600 clamp(1.3rem, 3vw, 1.8rem)/1.3 var(--serif);
    color: var(--yellow);
    text-underline-offset: 6px;
    text-decoration-thickness: 2px;
    word-break: break-word;
  }
  .mail:hover { color: var(--ink); }

  footer { border-top: 1px solid var(--line); padding: 26px 0 36px; font-size: 0.85rem; color: var(--muted); }
  footer p { margin: 0 0 6px; }

  @media (max-width: 820px) {
    .hero { grid-template-columns: 1fr; gap: 44px; padding-bottom: 56px; }
    .gate { max-width: 270px; justify-self: start; }
  }
</style>
</head>
